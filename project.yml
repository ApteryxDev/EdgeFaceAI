name: EdgeFaceAI
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    CLANG_ENABLE_EXPLICIT_MODULES: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  EdgeFaceAI:
    type: application
    platform: iOS
    sources:
      - App
      - path: Resources/ConversionFixtures
        type: folder
        buildPhase: resources
      - path: Resources/UTKDevelopment
        type: folder
        buildPhase: resources
      - path: Resources/FACESDevelopment
        type: folder
        buildPhase: resources
      - path: Models
        excludes:
          - AgeClassifier.mlmodel
          - GenderClassifier.mlmodel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.student.edgefaceai
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Use the camera for live facial-attribute predictions on this device.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_CFBundleDisplayName: EdgeFace AI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
